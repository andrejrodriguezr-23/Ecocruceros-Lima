name: Build and deploy to GitHub Pages

# Rebuilds the Eleventy site and redeploys to GitHub Pages on every push to
# main (or manually via the Actions tab). No hand-building required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed by the official Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deploy at a time; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Custom domain at the root → default path prefix "/".
      - name: Build site
        run: npx @11ty/eleventy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
