name: Build and deploy to GitHub Pages (production — MANUAL)

# Production deploy. Intentionally MANUAL-ONLY: it does NOT run automatically
# on pushes to main, so nothing is published until you decide where the new
# site will live.
#
# The production domain is undecided (ecocruceros.com OR another domain the
# client owns), so this build no longer hardcodes a domain — there is no CNAME
# file in the repo. When you choose the domain, either:
#   • add a CNAME file at src/root/CNAME with that domain, or
#   • set the custom domain under Settings → Pages,
# then run this workflow manually (Actions → this workflow → "Run workflow").
#
# Note: while the staging preview is served from the `gh-pages` branch
# (Settings → Pages → Source), switch the Pages source back to "GitHub Actions"
# before running this production deploy.

on:
  workflow_dispatch:

# Permissions needed by the official Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deploy at a time; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Custom domain at the root → default path prefix "/".
      - name: Build site
        run: npx @11ty/eleventy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
